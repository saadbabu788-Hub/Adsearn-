name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VERSION_RAW=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VERSION_RAW"
          if [ -z "$JAVA_VERSION_RAW" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$JAVA_VERSION_RAW" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse Java major version."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version is $MAJOR_VERSION, but 17 or newer is required."
            exit 1
          fi
          echo "Java environment verified: Java $MAJOR_VERSION is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create or restore debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Ensure APK dual v1 and v2 signing
        run: |
          APKSIGNER=$(find ${ANDROID_HOME:-/opt/android/sdk}/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Applying apksigner with dual v1 and v2 signing: $APKSIGNER"
            $APKSIGNER sign \
              --ks ./debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --min-sdk-version 24 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              app/build/outputs/apk/debug/app-debug.apk
            echo "Verifying APK signatures:"
            $APKSIGNER verify --verbose app/build/outputs/apk/debug/app-debug.apk
          else
            echo "apksigner not found; continuing with Gradle APK signature."
          fi

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK $EXPECTED_APK not found."
            echo "Searching for APK files inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected APK $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: Expected APK $EXPECTED_APK does not have .apk extension."
            exit 1
          fi

          echo "Verified APK: $EXPECTED_APK is a valid non-empty APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="app"
          fi
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"

          RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset.XXXXXX")
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH is missing or empty."
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset $ASSET_PATH does not have .apk extension."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat << 'EOF' > /tmp/release_notes.md
          ### Debug APK Build

          This is an automatically generated debug APK.
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Target**: Testing & Development

          > **Notice**:
          > - This APK is intended for testing.
          > - This APK is not a Play Store production release.
          > - This APK is signed only with a temporary debug keystore.
          EOF

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="${{ steps.create_release.outputs.release_tag }}"
            RELEASE_TITLE="${{ steps.create_release.outputs.release_title }}"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG" || true

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published directly to GitHub Releases:"
              echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Download APK**: You can download \`$ASSET_FILENAME\` directly from the **Assets** section of the release page on your phone or computer."
              echo "- **Actions Artifact**: The standard workflow artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully, but the debug APK build succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)"
              echo ""
              echo "- **APK Build**: Succeeded."
              echo "- **Actions Artifact**: The debug APK artifact named \`app-debug-apk\` was uploaded successfully and is available for download in the workflow run summary."
              echo "- **Release Publishing**: Release creation was not completed. Please check repository permissions for \`GITHUB_TOKEN\` (ensure *Read and write permissions* are enabled under *Settings > Actions > General > Workflow permissions*)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
